{% extends "ats/base.html" %}{% block title %}Sign in{% endblock %}{% block body %}
<div class="card" style="max-width:420px;margin:40px auto"><h1>Sign in to HireDesk</h1>
{% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
<form method="post" action="/login"><input type="hidden" name="next" value="{{ next }}">
<label for="username">Username</label><input type="text" id="username" name="username" autocomplete="username">
<label for="password">Password</label><input type="password" id="password" name="password" autocomplete="current-password">
<button type="submit">Sign in</button></form></div>{% endblock %}
