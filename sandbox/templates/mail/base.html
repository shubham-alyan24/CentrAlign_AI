<!doctype html><html><head><meta charset="utf-8"><title>{% block title %}Acme Mail{% endblock %} · Acme Mail</title>
<link rel="stylesheet" href="/static/style.css"></head><body class="mail">
<div class="top"><span class="brand">Acme Mail</span><span class="who">Signed in as {{ owner }}</span></div>
<div class="wrap"><nav class="side">
<a href="/compose" class="{{ 'on' if folder=='compose' }}">✉ Compose</a>
<a href="/" class="{{ 'on' if folder=='inbox' }}">Inbox</a>
<a href="/sent" class="{{ 'on' if folder=='sent' }}">Sent</a></nav>
<main>{% if flash %}<div class="flash" role="status">{{ flash }}</div>{% endif %}{% block body %}{% endblock %}</main></div></body></html>
